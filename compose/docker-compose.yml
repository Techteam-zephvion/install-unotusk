# UNOTUSK Customer Stack
#
# Architecture:
#   Internet/LAN → 443/80 → Caddy → (internal Docker network)
#                                     US:7000   Auth Service
#                                     UPS:7001  Company Server
#                                     AI-PIE:7002
#                                     UAC:7003  Admin Pairing
#
# Only Caddy is exposed on the host. All other services are internal.
# gRPC (US:50052, UPS:50051) is proxied via Caddy h2 on 443.
#
# Quickstart:
#   cp .env.example .env   # fill required values
#   docker compose up -d

networks:
  unotusk_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  qdrant_data:
  phoenix_data:
  us_data:
  ups_data:
  ai_pie_data:
  caddy_data:
  caddy_config:
  logs:

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unotusk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-unotusk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - unotusk_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unotusk}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "3" }

  # ── Qdrant ─────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.15.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - unotusk_internal
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat </dev/null >/dev/tcp/localhost/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "3" }

  # ── Arize Phoenix ──────────────────────────────────────────────────────────
  phoenix:
    image: arizephoenix/phoenix:latest
    restart: unless-stopped
    volumes:
      - phoenix_data:/root/.phoenix
    networks:
      - unotusk_internal
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "3" }

  # ── US — Auth Service ──────────────────────────────────────────────────────
  # Internal only — Caddy proxies HTTP on 7000, gRPC mTLS on 7002
  us:
    image: ghcr.io/unotusk/us:${UNOTUSK_VERSION:-latest}
    hostname: auth-server
    restart: unless-stopped
    env_file:
      - ./US/.env
    environment:
      HTTP_LISTEN_ADDR: 0.0.0.0:7000
      GRPC_LISTEN_ADDR: 0.0.0.0:7002
      UAC_PAIRING_ADDR: 0.0.0.0:7003
      DATABASE_URL: postgres://${POSTGRES_USER:-unotusk}:${POSTGRES_PASSWORD}@postgres:5432/auth
      UPS_LICENSE_STATUS_URL: http://company-server:7001/license/status
      PLATFORM_TOKEN_AUDIENCE: ${PLATFORM_TOKEN_AUDIENCE:-platform.unotusk.com}
      ORG_ID: ${ORG_ID}
      RUST_LOG: ${LOG_LEVEL:-info}
    expose:
      - "7000"   # HTTP  (OIDC, /healthz)
      - "7002"   # gRPC mTLS
      - "7003"   # UAC admin pairing
    volumes:
      - us_data:/app/data
      - ./US/certs:/app/certs:ro
      - logs:/app/logs
    networks:
      unotusk_internal:
        aliases:
          - auth-server
          - us
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options: { max-size: "100m", max-file: "5" }

  # ── UPS — Company Server ───────────────────────────────────────────────────
  # Internal only — Caddy proxies gRPC mTLS on 7004
  ups:
    image: ghcr.io/unotusk/ups:${UNOTUSK_VERSION:-latest}
    hostname: company-server
    restart: unless-stopped
    env_file:
      - ./UPS/.env
    environment:
      HEALTH_LISTEN_ADDR: 0.0.0.0:7001
      GRPC_LISTEN_ADDR: 0.0.0.0:7004
      AUTH_GRPC_ENDPOINT: https://auth-server:7002
      DATABASE_URL: postgres://${POSTGRES_USER:-unotusk}:${POSTGRES_PASSWORD}@postgres:5432/company
      PLATFORM_URL: ${PLATFORM_URL:?PLATFORM_URL is required}
      PLATFORM_LICENSE_KEY: ${PLATFORM_LICENSE_KEY:?PLATFORM_LICENSE_KEY is required}
      LICENSE_HEARTBEAT_INTERVAL_SECS: ${LICENSE_HEARTBEAT_INTERVAL:-60}
      LICENSE_GRACE_PERIOD_SECS: ${LICENSE_GRACE_PERIOD:-18000}
      PLATFORM_CA_CERT: /app/certs/platform/ca.crt
      PLATFORM_CLIENT_TLS_CERT: /app/certs/platform/client.crt
      PLATFORM_CLIENT_TLS_KEY: /app/certs/platform/client.key
      ORG_ID: ${ORG_ID:?ORG_ID is required}
      US_JWKS_URL: http://auth-server:7000/.well-known/jwks.json
      PLATFORM_JWKS_PUSH_URL: ${PLATFORM_JWKS_PUSH_URL}
      JWKS_PUSH_SECRET: ${JWKS_PUSH_SECRET}
      RUST_LOG: ${LOG_LEVEL:-info}
    expose:
      - "7001"   # HTTP health
      - "7004"   # gRPC mTLS (business)
    volumes:
      - ups_data:/app/data
      - ./UPS/certs:/app/certs:ro
      - logs:/app/logs
    networks:
      unotusk_internal:
        aliases:
          - company-server
          - ups
    depends_on:
      postgres:
        condition: service_healthy
      us:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7001/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options: { max-size: "100m", max-file: "5" }

  # ── AI-PIE — Intelligence Engine ───────────────────────────────────────────
  ai-pie:
    image: ghcr.io/unotusk/ai-pie:${UNOTUSK_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - ./AI-PIE/.env
    environment:
      LISTEN_ADDR: 0.0.0.0:7005
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      ONTOLOGY_DB_PATH: /app/data/ontology.db
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      UPS_LICENSE_STATUS_URL: http://company-server:7001/license/status
      GITHUB_ORG: ${GITHUB_ORG_NAME:-}
      JIRA_URL: ${JIRA_URL:-}
    expose:
      - "7005"   # HTTP API
    volumes:
      - ai_pie_data:/app/data
      - ./AI-PIE/certs:/app/certs:ro
      - logs:/app/logs
    networks:
      unotusk_internal:
        aliases:
          - ai-pie
    depends_on:
      qdrant:
        condition: service_healthy
      phoenix:
        condition: service_healthy
      ups:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7005/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options: { max-size: "100m", max-file: "5" }

  # ── Caddy — Reverse Proxy ──────────────────────────────────────────────────
  # The ONLY service with host ports (80, 443).
  # Handles TLS termination and routes to all internal services.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP → redirect to HTTPS
      - "443:443"   # HTTPS + gRPC-TLS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - unotusk_internal
    depends_on:
      us:
        condition: service_healthy
      ups:
        condition: service_healthy
      ai-pie:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "3" }
