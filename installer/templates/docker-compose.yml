# ==============================================================================
# UNOTUSK Platform — Service Container Orchestration
# ==============================================================================

networks:
  unotusk_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  phoenix_data:
  us_data:
  ups_data:
  ai_pie_data:
  caddy_data:
  caddy_config:
  logs:

services:

  # ── PostgreSQL — relational databases for US and UPS metadata ──
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unotusk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - unotusk_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unotusk}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # ── Redis — Shared in-memory cache and session state ──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    networks:
      - unotusk_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # ── Qdrant — AI reasoning vector database ──
  qdrant:
    image: qdrant/qdrant:v1.15.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - unotusk_internal
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/6333"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # ── Arize Phoenix — AI observability framework ──
  phoenix:
    image: arizephoenix/phoenix:latest
    restart: unless-stopped
    volumes:
      - phoenix_data:/root/.phoenix
    networks:
      - unotusk_internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # ── US — Auth Service (OIDC issuer, JWT pair verification) ──
  us:
    image: unotusk/us:local
    hostname: auth-server
    restart: unless-stopped
    env_file:
      - ./US/.env
    environment:
      HTTP_LISTEN_ADDR: 0.0.0.0:3000
      # config.rs defaults ADMIN_LISTEN_ADDR to 127.0.0.1:8444 (loopback
      # *inside* the container) — Docker's published-port NAT delivers
      # traffic to the container's external interface, never to its own
      # loopback, so the admin pairing endpoint was unreachable from the
      # host no matter what port was published. The pairing cert's SAN
      # already includes "localhost" unconditionally (admin_pki.rs), so
      # this bind-address change doesn't invalidate it.
      ADMIN_LISTEN_ADDR: 0.0.0.0:8444
      DATABASE_URL: postgres://${POSTGRES_USER:-unotusk}:${POSTGRES_PASSWORD}@postgres:5432/auth
      UPS_LICENSE_STATUS_URL: http://company-server:8080/license/status
      PLATFORM_TOKEN_AUDIENCE: ${PLATFORM_TOKEN_AUDIENCE:-platform.unotusk.com}
      RUST_LOG: ${LOG_LEVEL:-info}
    ports:
      - "3100:3000"   # OIDC/GitHub OAuth HTTP (login/callback/healthz/jwks) —
                       # never published before this; UCA/UAC run on the host
                       # and could never reach login without it. Host-side
                       # port picked to avoid colliding with other local dev
                       # servers commonly bound to 3000 — container-internal
                       # port stays 3000 (HTTP_LISTEN_ADDR above), only the
                       # host mapping changed.
      - "8444:8444"   # UAC administrative pairing (US's own admin listener,
                       # distinct from UPS's on 8443)
      - "50052:50052" # gRPC mTLS — UCA (a host app, unlike UPS/AI-PIE which
                       # reach this over the internal Docker network as
                       # "auth-server:50052") needs this reachable directly
                       # to exchange_ref() after GitHub OAuth completes.
    volumes:
      - us_data:/app/data
      - ./US/certs:/app/certs:ro
      - logs:/app/logs
    networks:
      unotusk_internal:
        aliases:
          - auth-server
          - us
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  # ── UPS — Company Server (outbound heartbeat, licensing) ──
  ups:
    image: unotusk/ups:local
    hostname: company-server
    restart: unless-stopped
    env_file:
      - ./UPS/.env
    environment:
      HEALTH_LISTEN_ADDR: 0.0.0.0:8080
      AUTH_GRPC_ENDPOINT: https://auth-server:50052
      CA_CERT: /app/certs/ca.crt
      SERVER_TLS_CERT: /app/certs/server.crt
      SERVER_TLS_KEY: /app/certs/server.key
      AUTH_CLIENT_TLS_CERT: /app/certs/client.crt
      AUTH_CLIENT_TLS_KEY: /app/certs/client.key
      DATABASE_URL: postgres://${POSTGRES_USER:-unotusk}:${POSTGRES_PASSWORD}@postgres:5432/company
      PLATFORM_URL: ${PLATFORM_URL}
      PLATFORM_LICENSE_KEY: ${PLATFORM_LICENSE_KEY}
      PLATFORM_CA_CERT: /app/certs/platform/ca.crt
      PLATFORM_CLIENT_TLS_CERT: /app/certs/platform/client.crt
      PLATFORM_CLIENT_TLS_KEY: /app/certs/platform/client.key
      US_JWKS_URL: http://auth-server:3000/.well-known/jwks.json
      RUST_LOG: ${LOG_LEVEL:-info}
    ports:
      - "8443:8443"   # UAC administrative pairing — never published before this;
                       # UAC runs on the host, outside unotusk_internal, and could
                       # never reach this listener without it.
      - "50051:50051" # gRPC business API (ClientService) — UCA calls this
                       # directly after exchange_ref() to attach_to_client();
                       # same host-app-reachability gap as US's 50052.
    volumes:
      - ups_data:/app/data
      - ./UPS/certs:/app/certs:ro
      - ./UPS/certs/platform:/app/certs/platform:ro
      - logs:/app/logs
    networks:
      unotusk_internal:
        aliases:
          - company-server
          - ups
    depends_on:
      postgres:
        condition: service_healthy
      us:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  # ── AI PIE — Core AI engineering reasoning backend ──
  ai-pie:
    image: unotusk/ai-pie:local
    restart: unless-stopped
    env_file:
      - ./AI-PIE/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      ONTOLOGY_DB_PATH: /app/data/ontology.db
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      UPS_LICENSE_STATUS_URL: http://company-server:8080/license/status
      # AMEND-007: AI-PIE validates bearer tokens against US's auth gRPC
      # directly. Was never overridden here — defaulted to settings.py's
      # localhost:50052, which inside this container means itself, not the
      # us service. auth-server is us's network alias.
      AUTH_GRPC_ENDPOINT: auth-server:50052
      AUTH_CLIENT_CA_CERT: /app/certs/auth-client/ca.pem
      AUTH_CLIENT_TLS_CERT: /app/certs/auth-client/cert.pem
      AUTH_CLIENT_TLS_KEY: /app/certs/auth-client/key.pem
    ports:
      - "8000:8000"   # UCA's "Ask"/spec-generation calls hit this directly
                       # (confusingly named UPS_BASE_URL in UCA's config,
                       # but it targets AI-PIE, not UPS) — never published
                       # before this, same host-reachability gap as US/UPS.
    volumes:
      - ai_pie_data:/app/data
      - ./AI-PIE/certs:/app/certs:ro
      - logs:/app/logs
    networks:
      unotusk_internal:
        aliases:
          - ai-pie
    depends_on:
      qdrant:
        condition: service_healthy
      phoenix:
        condition: service_healthy
      ups:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, ssl; ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE; ctx.load_cert_chain(certfile='/app/certs/dev/client.pem', keyfile='/app/certs/dev/client.key'); urllib.request.urlopen('https://localhost:8000/health', context=ctx)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  # ── Caddy — Unified HTTPS Reverse Proxy Gateway ──
  caddy:
    image: caddy:2.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./templates/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./caddy/certs:/etc/caddy/certs:ro
    networks:
      - unotusk_internal
    depends_on:
      us:
        condition: service_healthy
      ups:
        condition: service_healthy
      ai-pie:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 15s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
