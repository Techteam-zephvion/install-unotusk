name: Build Windows Apps (Employee & Server Setup)

on:
  push:
    branches:
      - windows-server
      - "windows-server**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Build Version (e.g. 1.0.1)"
        required: false
        default: "1.0.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.x"
  FLUTTER_CHANNEL: "stable"

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Employee Desktop App: Windows x64 MSI Installer
  # ─────────────────────────────────────────────────────────────
  build-employee-windows:
    name: "Employee App: Windows x64 (.msi)"
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release

      - name: Build MSI Installer
        shell: pwsh
        run: |
          $src = @(
            "app\build\windows\x64\runner\Release",
            "app\build\windows\runner\Release"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $src) { Write-Error "Release directory not found"; exit 1 }

          pwsh -ExecutionPolicy Bypass -File scripts/package_windows_msi.ps1 `
            -AppName "Unotusk Employee" `
            -ExeName "app.exe" `
            -SourceDir "$src" `
            -OutputFile "unotusk-employee-windows-x64.msi" `
            -UpgradeCode "7D2A3F4E-8B9C-4D5E-A6F7-1C2B3A495E6D" `
            -Version "1.0.1.0"

      - name: Upload Employee App MSI
        uses: actions/upload-artifact@v4
        with:
          name: unotusk-employee-windows-x64.msi
          path: unotusk-employee-windows-x64.msi
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # 2. Server Setup App: Windows x64 MSI Installer
  # ─────────────────────────────────────────────────────────────
  build-server-windows:
    name: "Server Setup App: Windows x64 (.msi)"
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        working-directory: setup_app
        run: flutter pub get

      - name: Build Windows release
        working-directory: setup_app
        run: flutter build windows --release

      - name: Build Server Setup MSI Installer
        shell: pwsh
        run: |
          $src = @(
            "setup_app\build\windows\x64\runner\Release",
            "setup_app\build\windows\runner\Release"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $src) { Write-Error "Release directory not found"; exit 1 }

          pwsh -ExecutionPolicy Bypass -File scripts/package_windows_msi.ps1 `
            -AppName "Unotusk Server Setup" `
            -ExeName "setup_app.exe" `
            -SourceDir "$src" `
            -OutputFile "unotusk-server-setup-windows-x64.msi" `
            -UpgradeCode "9E4C5D6F-7A8B-9C0D-E1F2-3A4B5C6D7E8F" `
            -Version "1.0.1.0"

      - name: Upload Server Setup App MSI
        uses: actions/upload-artifact@v4
        with:
          name: unotusk-server-setup-windows-x64.msi
          path: unotusk-server-setup-windows-x64.msi
          retention-days: 14
