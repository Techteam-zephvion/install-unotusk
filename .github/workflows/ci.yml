name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-checks:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unotusk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Ruff Linting
        run: ruff check apps/api/ tests/

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/unotusk_test
          SYNC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unotusk_test
        run: alembic upgrade head

      - name: Run Pytest Suite
        env:
          APP_ENV: test
          DEBUG: "true"
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/unotusk_test
          SYNC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unotusk_test
          REDIS_URL: redis://localhost:6379/0
          AUTH_SECRET: ci-test-secret-minimum-32-chars-long-1234
        run: pytest -v --cov=apps/api/src

  flutter-employee-app:
    name: Flutter Employee App — Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Flutter Analyze (Employee App)
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: Flutter Test (Employee App)
        working-directory: app
        run: flutter test

  flutter-setup-app:
    name: Flutter Setup App — Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable

      - name: Install Dependencies
        working-directory: setup_app
        run: flutter pub get

      - name: Flutter Analyze (Setup App)
        working-directory: setup_app
        run: flutter analyze --fatal-infos

      - name: Flutter Test (Setup App)
        working-directory: setup_app
        run: flutter test
