name: CI

on:
  push:
    branches:
      - MVP_build
      - main
  pull_request:
    branches:
      - MVP_build
      - main

jobs:
  lint-rust:
    name: Lint Rust Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [US, UPS, UP]
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache Cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: ${{ matrix.service }}/target
          key: ${{ runner.os }}-cargo-build-${{ matrix.service }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.service)) }}
      - name: Run Clippy
        working-directory: ${{ matrix.service }}
        run: cargo clippy --all-targets -- -D warnings
      - name: Run rustfmt
        working-directory: ${{ matrix.service }}
        run: cargo fmt --check

  test-rust:
    name: Test Rust Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [US, UPS, UP]
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache Cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: ${{ matrix.service }}/target
          key: ${{ runner.os }}-cargo-build-${{ matrix.service }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.service)) }}
      - name: Run Tests
        working-directory: ${{ matrix.service }}
        run: cargo test --all

  lint-python:
    name: Lint Python Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: AI-PIE
        run: pip install ruff
      - name: Run ruff
        working-directory: AI-PIE
        run: ruff check app/

  test-python:
    name: Test Python Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: AI-PIE
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run Pytest
        working-directory: AI-PIE
        run: python -m pytest || echo "No tests found or test failed"

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Create minimal .env for build
        run: |
          echo "POSTGRES_USER=unotusk" > .env
          echo "POSTGRES_PASSWORD=unotusk" >> .env
          echo "POSTGRES_DB=unotusk" >> .env
          echo "QDRANT_API_KEY=testkey" >> .env
          echo "PLATFORM_URL=https://platform.unotusk.com" >> .env
          echo "PLATFORM_LICENSE_KEY=TEST-LICENSE" >> .env
          echo "ORG_ID=test-org" >> .env
          echo "JWKS_PUSH_SECRET=testsecret" >> .env
          echo "PLATFORM_TOKEN_AUDIENCE=platform.unotusk.com" >> .env
          echo "PLATFORM_JWKS_PUSH_URL=https://platform.unotusk.com/internal" >> .env
      - name: Build Images
        run: docker compose build

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - uses: actions/checkout@v4
      - name: Create minimal .env
        run: |
          echo "POSTGRES_USER=unotusk" > .env
          echo "POSTGRES_PASSWORD=unotusk" >> .env
          echo "POSTGRES_DB=unotusk" >> .env
          echo "QDRANT_API_KEY=testkey" >> .env
          echo "PLATFORM_URL=https://platform.unotusk.com" >> .env
          echo "PLATFORM_LICENSE_KEY=TEST-LICENSE" >> .env
          echo "ORG_ID=test-org" >> .env
          echo "JWKS_PUSH_SECRET=testsecret" >> .env
          echo "PLATFORM_TOKEN_AUDIENCE=platform.unotusk.com" >> .env
          echo "PLATFORM_JWKS_PUSH_URL=https://platform.unotusk.com/internal" >> .env
      - name: Build Images
        run: docker compose build
      - name: Run Integration Tests
        run: |
          mkdir -p test-results
          export INSTALL_DIR=$GITHUB_WORKSPACE
          chmod +x scripts/test-integration.sh
          ./scripts/test-integration.sh --junit-output test-results/integration.xml || true
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/integration.xml

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-docker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Create minimal .env
        run: |
          echo "POSTGRES_USER=unotusk" > .env
          echo "POSTGRES_PASSWORD=unotusk" >> .env
          echo "POSTGRES_DB=unotusk" >> .env
      - name: Build Images
        run: docker compose build
      - name: Install Trivy
        run: |
          sudo apt-get install wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy
      - name: Scan Images with Trivy
        run: |
          trivy image unotusk-us:latest || true
          trivy image unotusk-ups:latest || true
          trivy image unotusk-ai-pie:latest || true
