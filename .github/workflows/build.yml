name: Build Employee App — All Platforms

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 1.0.0)"
        required: false
        default: "dev"

# Cancel in-progress runs for the same branch/tag to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.x"
  FLUTTER_CHANNEL: "beta"
  APP_DIR: app

jobs:
  # ──────────────────────────────────────────────
  # 1. Linux build (Ubuntu runner)
  # ──────────────────────────────────────────────
  build-linux:
    name: "🐧 Linux x64"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter (beta)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Build Linux release
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter build linux --release \
            --build-name="${{ github.event.inputs.version || '1.0.0' }}" \
            --build-number="${{ github.run_number }}"

      - name: Package as tar.gz + sha256
        working-directory: ${{ env.APP_DIR }}/build/linux/x64/release
        run: |
          tar -czf unotusk-employee-linux-x64.tar.gz bundle/
          sha256sum unotusk-employee-linux-x64.tar.gz > unotusk-employee-linux-x64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unotusk-employee-linux-x64
          path: |
            ${{ env.APP_DIR }}/build/linux/x64/release/unotusk-employee-linux-x64.tar.gz
            ${{ env.APP_DIR }}/build/linux/x64/release/unotusk-employee-linux-x64.tar.gz.sha256
          retention-days: 30

  # ──────────────────────────────────────────────
  # 2. Windows build (Windows runner)
  # ──────────────────────────────────────────────
  build-windows:
    name: "🪟 Windows x64"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (beta)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Build Windows release
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter build windows --release `
            --build-name="${{ github.event.inputs.version || '1.0.0' }}" `
            --build-number="${{ github.run_number }}"

      - name: Package as zip + sha256
        working-directory: ${{ env.APP_DIR }}\build\windows\x64\runner\Release
        shell: pwsh
        run: |
          Compress-Archive -Path . -DestinationPath unotusk-employee-windows-x64.zip
          $hash = Get-FileHash unotusk-employee-windows-x64.zip -Algorithm SHA256
          "$($hash.Hash)  unotusk-employee-windows-x64.zip" | Out-File unotusk-employee-windows-x64.zip.sha256 -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unotusk-employee-windows-x64
          path: |
            ${{ env.APP_DIR }}\build\windows\x64\runner\Release\unotusk-employee-windows-x64.zip
            ${{ env.APP_DIR }}\build\windows\x64\runner\Release\unotusk-employee-windows-x64.zip.sha256
          retention-days: 30

  # ──────────────────────────────────────────────
  # 3. macOS build (macOS runner)
  # ──────────────────────────────────────────────
  build-macos:
    name: "🍎 macOS (Universal)"
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (beta)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Build macOS release
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter build macos --release \
            --build-name="${{ github.event.inputs.version || '1.0.0' }}" \
            --build-number="${{ github.run_number }}"

      - name: Package as zip + sha256
        working-directory: ${{ env.APP_DIR }}/build/macos/Build/Products/Release
        run: |
          zip -r unotusk-employee-macos.zip "app.app"
          shasum -a 256 unotusk-employee-macos.zip > unotusk-employee-macos.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unotusk-employee-macos
          path: |
            ${{ env.APP_DIR }}/build/macos/Build/Products/Release/unotusk-employee-macos.zip
            ${{ env.APP_DIR }}/build/macos/Build/Products/Release/unotusk-employee-macos.zip.sha256
          retention-days: 30

  # ──────────────────────────────────────────────
  # 4. GitHub Release (only on v* tags)
  # ──────────────────────────────────────────────
  release:
    name: "📦 GitHub Release"
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List downloaded files
        run: find dist/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Unotusk Employee App ${{ github.ref_name }}"
          body: |
            ## Unotusk Employee App — ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |---|---|
            | 🐧 Linux x64 | `unotusk-employee-linux-x64.tar.gz` |
            | 🪟 Windows x64 | `unotusk-employee-windows-x64.zip` |
            | 🍎 macOS | `unotusk-employee-macos.zip` |

            Each archive has a matching `.sha256` checksum file.

            ### Connect to server
            Open Settings → enter your server URL: `http://<SERVER_LAN_IP>:8000`
          draft: false
          prerelease: false
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.sha256
