name: Build Employee App — All Platforms

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 1.0.0)"
        required: false
        default: "dev"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.x"
  FLUTTER_CHANNEL: "beta"
  APP_DIR: app

jobs:
  # ──────────────────────────────────────────────
  # 1. Linux — tar.gz
  # ──────────────────────────────────────────────
  build-linux:
    name: "Linux x64 (.tar.gz)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter config --enable-linux-desktop

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Build Linux release
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter build linux --release \
            --build-name="${{ github.event.inputs.version || '1.0.0' }}" \
            --build-number="${{ github.run_number }}"

      - name: Package tar.gz + sha256
        working-directory: ${{ env.APP_DIR }}/build/linux/x64/release
        run: |
          tar -czf unotusk-employee-linux-x64.tar.gz bundle/
          sha256sum unotusk-employee-linux-x64.tar.gz > unotusk-employee-linux-x64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: unotusk-employee-linux-x64
          path: |
            ${{ env.APP_DIR }}/build/linux/x64/release/unotusk-employee-linux-x64.tar.gz
            ${{ env.APP_DIR }}/build/linux/x64/release/unotusk-employee-linux-x64.tar.gz.sha256
          retention-days: 30

  # ──────────────────────────────────────────────
  # 2. Windows — MSI installer via WiX v3
  # ──────────────────────────────────────────────
  build-windows:
    name: "Windows x64 (.msi)"
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ github.event.inputs.version || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter config --enable-windows-desktop

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Build Windows release
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          flutter build windows --release `
            --build-name="$env:APP_VERSION" `
            --build-number="${{ github.run_number }}"

      - name: Locate WiX v3
        id: wix
        shell: pwsh
        run: |
          $dir = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -EA SilentlyContinue |
                 Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dir) {
            choco install wixtoolset -y --no-progress | Out-Null
            $dir = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" |
                   Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          echo "WIX_BIN=$dir\bin" >> $env:GITHUB_OUTPUT
          Write-Host "WiX found at: $dir\bin"

      - name: Harvest files + build MSI
        shell: pwsh
        env:
          WIX_BIN: ${{ steps.wix.outputs.WIX_BIN }}
        run: |
          # Resolve build output path (Flutter may put it in x64 or root runner dir)
          $src = @(
            "${{ env.APP_DIR }}\build\windows\x64\runner\Release",
            "${{ env.APP_DIR }}\build\windows\runner\Release"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $src) { Write-Error 'Flutter Release dir not found'; exit 1 }
          $src = (Resolve-Path $src).Path
          Write-Host "Source dir: $src"

          # Harvest all files from the Flutter release directory
          & "$env:WIX_BIN\heat.exe" dir $src `
            -o Components.wxs -scom -sreg -srd `
            -dr INSTALLFOLDER -cg AppComponents `
            -var var.SourceDir -nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # Write License.rtf (required by WixUI_Minimal)
          Set-Content License.rtf '{\rtf1\ansi Unotusk Employee App - Internal Use Only.}' -Encoding ascii

          # Write Product.wxs via a Python script file (avoids pwsh argument-passing issues)
          $ver = "$env:APP_VERSION.0"
          $pyScript = 'Product.wxs'
          $wxsContent = @(
            "<?xml version='1.0' encoding='UTF-8'?>"
            "<Wix xmlns='http://schemas.microsoft.com/wix/2006/wi'>"
            "  <Product Id='*' Name='Unotusk Employee' Language='1033'"
            "           Version='$ver' Manufacturer='Techteam Zephvion'"
            "           UpgradeCode='7D2A3F4E-8B9C-4D5E-A6F7-1C2B3A495E6D'>"
            "    <Package InstallerVersion='500' Compressed='yes' InstallScope='perMachine' Platform='x64'/>"
            "    <MajorUpgrade DowngradeErrorMessage='A newer version is already installed.'/>"
            "    <MediaTemplate EmbedCab='yes'/>"
            "    <Feature Id='ProductFeature' Title='Unotusk Employee' Level='1'>"
            "      <ComponentGroupRef Id='AppComponents'/>"
            "      <ComponentRef Id='DesktopShortcutComp'/>"
            "      <ComponentRef Id='StartMenuShortcutComp'/>"
            "    </Feature>"
            "    <UIRef Id='WixUI_Minimal'/>"
            "    <WixVariable Id='WixUILicenseRtf' Value='License.rtf'/>"
            "  </Product>"
            "  <Fragment>"
            "    <Directory Id='TARGETDIR' Name='SourceDir'>"
            "      <Directory Id='ProgramFiles64Folder'>"
            "        <Directory Id='INSTALLFOLDER' Name='Unotusk Employee'/>"
            "      </Directory>"
            "      <Directory Id='DesktopFolder'/>"
            "      <Directory Id='ProgramMenuFolder'>"
            "        <Directory Id='StartMenuAppFolder' Name='Unotusk Employee'/>"
            "      </Directory>"
            "    </Directory>"
            "  </Fragment>"
            "  <Fragment>"
            "    <DirectoryRef Id='DesktopFolder'>"
            "      <Component Id='DesktopShortcutComp' Guid='A1B2C3D4-E5F6-7890-ABCD-111111111111' Win64='yes'>"
            "        <Shortcut Id='DesktopShortcut' Name='Unotusk Employee'"
            "                  Target='[INSTALLFOLDER]app.exe' WorkingDirectory='INSTALLFOLDER'/>"
            "        <RegistryValue Root='HKMU' Key='Software\\TechteamZephvion\\UnotuskEmployee'"
            "                       Name='DesktopShortcut' Type='integer' Value='1' KeyPath='yes'/>"
            "      </Component>"
            "    </DirectoryRef>"
            "    <DirectoryRef Id='StartMenuAppFolder'>"
            "      <Component Id='StartMenuShortcutComp' Guid='B2C3D4E5-F6A7-8901-BCDE-222222222222' Win64='yes'>"
            "        <Shortcut Id='StartMenuShortcut' Name='Unotusk Employee'"
            "                  Target='[INSTALLFOLDER]app.exe' WorkingDirectory='INSTALLFOLDER'/>"
            "        <RemoveFolder Id='RemoveStartMenuFolder' Directory='StartMenuAppFolder' On='uninstall'/>"
            "        <RegistryValue Root='HKMU' Key='Software\\TechteamZephvion\\UnotuskEmployee'"
            "                       Name='StartMenuShortcut' Type='integer' Value='1' KeyPath='yes'/>"
            "      </Component>"
            "    </DirectoryRef>"
            "  </Fragment>"
            "</Wix>"
          ) -join "`n"
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'Product.wxs'), $wxsContent)
          Write-Host 'Product.wxs written'
          Get-Content Product.wxs | Select-Object -First 5

          # Compile
          & "$env:WIX_BIN\candle.exe" -nologo -arch x64 -dSourceDir="$src" Product.wxs Components.wxs
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # Link — suppress ICE57 (HKMU is correct but WiX v3 sometimes still warns) and ICE91
          & "$env:WIX_BIN\light.exe" -nologo -ext WixUIExtension `
            -sice:ICE57 -sice:ICE91 `
            Product.wixobj Components.wixobj -o unotusk-employee-windows-x64.msi
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # Checksum
          $hash = (Get-FileHash unotusk-employee-windows-x64.msi -Algorithm SHA256).Hash
          "$hash  unotusk-employee-windows-x64.msi" | Out-File unotusk-employee-windows-x64.msi.sha256 -Encoding ascii
          Write-Host "Done. MSI: $([math]::Round((Get-Item unotusk-employee-windows-x64.msi).Length/1MB,1)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: unotusk-employee-windows-x64
          path: |
            unotusk-employee-windows-x64.msi
            unotusk-employee-windows-x64.msi.sha256
          retention-days: 30

  # ──────────────────────────────────────────────
  # 3. macOS — DMG disk image
  # ──────────────────────────────────────────────
  build-macos:
    name: "macOS (.dmg)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter config --enable-macos-desktop

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Build macOS release
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter build macos --release \
            --build-name="${{ github.event.inputs.version || '1.0.0' }}" \
            --build-number="${{ github.run_number }}"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        working-directory: ${{ env.APP_DIR }}/build/macos/Build/Products/Release
        run: |
          APP=$(ls -d *.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then echo "No .app found"; ls -la; exit 1; fi
          echo "Creating DMG for: $APP"

          create-dmg \
            --volname "Unotusk Employee" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "$APP" 180 185 \
            --hide-extension "$APP" \
            --app-drop-link 480 185 \
            --no-internet-enable \
            "unotusk-employee-macos.dmg" "$APP" || true

          if [ ! -f "unotusk-employee-macos.dmg" ]; then
            echo "Falling back to hdiutil..."
            mkdir -p _stage && cp -r "$APP" _stage/ && ln -s /Applications _stage/Applications
            hdiutil create -volname "Unotusk Employee" -srcfolder _stage \
              -ov -format UDZO "unotusk-employee-macos.dmg"
          fi

          shasum -a 256 unotusk-employee-macos.dmg > unotusk-employee-macos.dmg.sha256
          echo "DMG size: $(du -sh unotusk-employee-macos.dmg | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: unotusk-employee-macos
          path: |
            ${{ env.APP_DIR }}/build/macos/Build/Products/Release/unotusk-employee-macos.dmg
            ${{ env.APP_DIR }}/build/macos/Build/Products/Release/unotusk-employee-macos.dmg.sha256
          retention-days: 30

  # ──────────────────────────────────────────────
  # 4. GitHub Release — only on v* tags
  # ──────────────────────────────────────────────
  release:
    name: "GitHub Release"
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - run: find dist/ -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          name: "Unotusk Employee App ${{ github.ref_name }}"
          body: |
            ## Unotusk Employee App — ${{ github.ref_name }}

            | Platform | File | Format |
            |---|---|---|
            | Linux x64 | `unotusk-employee-linux-x64.tar.gz` | Archive |
            | Windows x64 | `unotusk-employee-windows-x64.msi` | MSI Installer |
            | macOS | `unotusk-employee-macos.dmg` | Disk Image |

            Each binary has a matching `.sha256` checksum file.

            **Windows** — double-click the `.msi`, click Install. Creates Start Menu + Desktop shortcuts.
            **macOS** — open the `.dmg`, drag the app to Applications.
            **Linux** — extract the `.tar.gz` and run `bundle/app`.

            Connect to server: `http://<SERVER_LAN_IP>:8000`
          draft: false
          prerelease: false
          files: |
            dist/**/*.tar.gz
            dist/**/*.msi
            dist/**/*.dmg
            dist/**/*.sha256
