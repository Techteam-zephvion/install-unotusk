name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build installer tarball
        run: |
          mkdir -p dist
          tar -czf dist/unotusk-installer.tar.gz --exclude="*.DS_Store" installer

      - name: Generate SHA-256 checksum
        run: |
          cd dist
          sha256sum unotusk-installer.tar.gz > unotusk-installer.tar.gz.sha256
          echo "CHECKSUM=$(awk '{print $1}' unotusk-installer.tar.gz.sha256)" >> "$GITHUB_OUTPUT"
        id: checksum

      - name: Validate bootstrap script syntax
        run: bash -n bootstrap/install.sh

      - name: Validate installer script syntax
        run: bash -n installer/install.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "UNOTUSK ${{ steps.version.outputs.VERSION }}"
          body: |
            ## UNOTUSK Installer ${{ steps.version.outputs.VERSION }}

            ### Installation

            ```bash
            curl -fsSL https://install.unotusk.com | bash
            ```

            ### Manual verification

            ```bash
            wget https://install.unotusk.com/dist/unotusk-installer.tar.gz
            wget https://install.unotusk.com/dist/unotusk-installer.tar.gz.sha256
            sha256sum --check unotusk-installer.tar.gz.sha256
            ```

            **SHA-256:** `${{ steps.checksum.outputs.CHECKSUM }}`
          files: |
            dist/unotusk-installer.tar.gz
            dist/unotusk-installer.tar.gz.sha256
          draft: false
          prerelease: false
